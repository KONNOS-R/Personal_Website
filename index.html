<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

        <title>KON/NOS R</title>
    </head>

    <body>
        <header>
            <h1 class="home-title">KON/NOS R</h1>
        </header>

        <div class="content">
            <div class="outer-container" id="container">
            
                <div class="nav">
                    <button id="csBtn" class="nav-card right" onclick="setHero('cs')">
                        Computer Science
                    </button>

                    <button id="photoBtn" class="nav-card left" onclick="setHero('photo')">
                        Photography
                    </button>
                </div>
            
                <div class="hero" id="hero"></div>
            </div>
        </div>
     
        <script>
        function setHero(section) {
            const hero = document.getElementById("hero");
            const container = document.getElementById("container");
        
            const photoBtn = document.getElementById("photoBtn");
            const csBtn = document.getElementById("csBtn");
        
            photoBtn.classList.remove("active");
            csBtn.classList.remove("active");
        
            let heroTitle = "";
            let heroText = "";
            let heroLink = "";
            let cardColor = "";
            let heroColor = "";
            let linkBg = "";
            let linkColor = "";

            if (section === "cs") { // Computer Science Card
                cardColor = "#6b145a";
                heroColor = "#fff";
                linkBg = "#eddbff";
                linkColor = "#000";
            
                csBtn.classList.add("active");
                csBtn.style.background = "#6b145a";
                csBtn.style.color = "#fff";
            
                photoBtn.style.background = "#eddbff";
                photoBtn.style.color = "#000";
            
                heroTitle = "Computer Science";
                heroImage = "images/computer-science.jpg"
                heroText = "Projects, algorithms, and software development.";
                heroLink = "computer-science.html";
            }
        
            if (section === "photo") { // Photography Card
                cardColor = "#76bfff";
                heroColor = "#000";
                linkBg = "#dbedff";
                linkColor = "#000";
            
                photoBtn.classList.add("active");
                photoBtn.style.background = "#76bfff";
                photoBtn.style.color = "#000";
            
                csBtn.style.background = "#dbedff";
                csBtn.style.color = "#000";
            
                heroTitle = "Photography";
                heroImage = "images/photography.jpg"
                heroText = "Visual work, light, and creative experiments.";
                heroLink = "photography.html";
            }
        
            container.style.background = cardColor;
        
            hero.classList.add("fade-out");
        
            setTimeout(() => {
                hero.innerHTML = `
                    <img class="hero-image" src="${heroImage}" alt="${heroTitle}">

                    <div class="hero-text">
                        <h2>${heroTitle}</h2>
                        <p>${heroText}</p>
                        <a class="hero-link" href="${heroLink}">View more</a>
                    </div>
                `;
            
                hero.style.color = heroColor;
            
                const link = hero.querySelector(".hero-link");
                link.style.background = linkBg;
                link.style.color = linkColor;
            
                hero.classList.remove("fade-out");
            }, 180);
        }

        window.onload = function () {
            setHero("cs");
        };
        </script>

    </body>
</html>
